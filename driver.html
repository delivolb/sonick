<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonick Driver Portal</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Stylesheets (shared design tokens + components, plus the portal's own layout) -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/rtl.css">
<link rel="stylesheet" href="css/driver.css">

<link rel="icon" type="image/png" href="assets/logo-mark.png">

<!-- Icon library + theme: load before first paint -->
<script src="js/icons.js"></script>
<script src="js/theme.js"></script>
<!-- Translations only (t() / TRANSLATIONS) — driver.js drives its own language toggle -->
<script src="js/i18n.js"></script>
</head>
<body>

<!-- LOADING -->
<div id="loading-screen">
  <div class="spinner"></div>
  <p style="color:var(--text-3);font-size:13px;">Connecting to Sonick...</p>
</div>

<!-- LOGIN -->
<div id="login-screen" class="hidden">
  <div class="login-card driver-login-card">
    <div class="login-logo">
      <img class="logo-mark-img logo-mark-img-lg" src="assets/logo-mark.png" alt="Sonick">
      <h1 id="driver-login-title">Driver Portal</h1>
      <p id="driver-login-subtitle">Sign in to view your assigned orders</p>
    </div>
    <div id="login-error" class="login-error hidden"></div>
    <form id="driver-login-form" onsubmit="handleDriverLogin(event)">
      <div class="form-group">
        <label class="form-label" id="driver-label-username">Username</label>
        <input type="text" id="driver-username" class="form-input" placeholder="e.g. ahmad.k" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" id="driver-label-password">Password</label>
        <input type="password" id="driver-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="driver-login-btn" style="margin-top:8px;">Sign In</button>
    </form>
    <div style="text-align:center;margin-top:16px;">
      <button class="btn btn-ghost btn-sm" onclick="toggleDriverLang()" id="driver-lang-btn" style="font-weight:700;">AR</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="driver-app" class="hidden">
  <header class="driver-header">
    <div class="driver-header-id">
      <img src="assets/logo-mark.png" alt="Sonick">
      <div style="min-width:0;">
        <div class="driver-header-name" id="driver-name-label">—</div>
        <div class="driver-header-sub" id="driver-phone-label">—</div>
      </div>
    </div>
    <div class="driver-header-actions">
      <button class="btn btn-secondary btn-sm" id="driver-lang-btn-app" onclick="toggleDriverLang()" style="font-weight:700;min-width:44px;">AR</button>
      <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()" title="Switch to Light Mode"><span data-icon="sun"></span></button>
      <button class="btn btn-ghost btn-sm" onclick="handleDriverLogout()" title="Sign Out"><span class="icon-inline" data-icon="logout"></span></button>
    </div>
  </header>

  <nav class="driver-tabs">
    <div class="driver-tab active" data-tab="orders" onclick="switchDriverTab('orders')">
      <span data-icon="package"></span>
      <span id="tab-orders-label">My Orders</span>
      <span class="driver-tab-count" id="tab-orders-count">0</span>
    </div>
    <div class="driver-tab" data-tab="archive" onclick="switchDriverTab('archive')">
      <span data-icon="archive"></span>
      <span id="tab-archive-label">My Archive</span>
      <span class="driver-tab-count" id="tab-archive-count">0</span>
    </div>
  </nav>

  <main class="driver-content" id="driver-content"></main>
</div>

<div id="toast-container"></div>

<script src="js/driver.js"></script>

</body>
</html>
